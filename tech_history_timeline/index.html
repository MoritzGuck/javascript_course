<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Tech History Timeline</title>
    <script src="timeline.js" defer></script>
</head>

<body>
    <header>
        <h1>Tech History Timeline</h1>
        <p>A journey through technological breakthroughs</p>
    </header>

    <nav>
        <form id="controls-form">
            <select name="era" id="era-select">
                <option value="" disabled selected>Filter by Era</option>
                <option value="all">All Eras</option>
                <option value="prehistoric">Prehistoric</option>
                <option value="modern">Modern</option>
            </select>
            <select name="category" id="category-select">
                <option value="all">All Categories</option>
                <option value="transport">Transport</option>
                <option value="information">Information</option>
                <option value="space">Space</option>
            </select>
            <input name="search" type="search" placeholder="Search fragments...">
            <button type="submit">search</button>
        </form>
    </nav>

    <main>
        <canvas id="timeline" width="1000" height="200"></canvas>
        <div id="events-container">
            <!-- Fragments will be projected here -->
        </div>
    </main>

    <footer>
        <p>
            © 2024 Chrono-Vault. All rights reserved.
        </p>
    </footer>
</body>

</html>
